[project]
name = "backend"
version = "0.1.0"
description = "Crypto Wallet -> VASP Attribution Engine (SIH26182)"
readme = "README.md"
authors = [
    { name = "qonstellations", email = "aarush.a.pathak@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "networkx>=3.6.1",
    "python-dotenv>=1.2.3",
    "reportlab>=5.0.1",
    "uvicorn[standard]>=0.34.3",
    "pyyaml>=6.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "core", "services", "scripts"]
